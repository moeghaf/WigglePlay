<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodcutter - WigglePlay</title>
<meta name="description" content="Woodcutter: a camera game for disabled children. Every movement swings the axe, and enough chops bring the tree down.">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#0b0b10">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
  #grass { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: #3b9a57; }
  #scene { position: absolute; left: 50%; bottom: 22%; width: min(52vh, 70vw); height: min(62vh, 84vw); margin-left: calc(min(52vh, 70vw) / -2); }
  #tree, #stump, #axe { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  #tree { transform-origin: 50% 96%; will-change: transform, opacity; }
  #axe { transform-origin: 86% 80%; will-change: transform; }
  #scene svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chip { position: absolute; left: 0; top: 0; width: 12px; height: 7px; border-radius: 2px; background: #c98a4b; will-change: transform, opacity; pointer-events: none; }
  #hud { position: absolute; left: 16px; top: 46px; display: flex; align-items: center; gap: 10px; font: 600 1.5rem/1 Fredoka, system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  #hud svg { width: 44px; height: 30px; }
  #level { position: absolute; right: 16px; top: 54px; font: 600 1.2rem/1 Fredoka, system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  #pile { position: absolute; left: 4%; bottom: 23%; width: 26%; display: flex; flex-wrap: wrap-reverse; gap: 4px; }
  #pile svg { width: 30%; max-width: 70px; height: auto; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createGame } from "../../shared/kit.js";

const LOG = '<svg viewBox="0 0 60 40" aria-hidden="true"><rect x="4" y="8" width="46" height="24" rx="6" fill="#a8683a"></rect><ellipse cx="50" cy="20" rx="7" ry="12" fill="#e2b684"></ellipse><ellipse cx="50" cy="20" rx="3.5" ry="6" fill="none" stroke="#b98250" stroke-width="1.6"></ellipse></svg>';
const TREE = `<svg viewBox="0 0 200 240" aria-hidden="true">
  <rect x="86" y="120" width="28" height="112" rx="6" fill="#8a5a33"></rect>
  <polygon id="notch" points="114,214 114,214 114,214" fill="#f1d2a6"></polygon>
  <circle cx="100" cy="78" r="62" fill="#2f9a56"></circle>
  <circle cx="58" cy="108" r="40" fill="#35a85f"></circle>
  <circle cx="142" cy="108" r="40" fill="#35a85f"></circle>
  <circle cx="100" cy="48" r="38" fill="#3db86a"></circle></svg>`;
const STUMP = `<svg viewBox="0 0 200 240" aria-hidden="true"><rect x="84" y="218" width="32" height="16" rx="5" fill="#8a5a33"></rect><ellipse cx="100" cy="219" rx="16" ry="5" fill="#e2b684"></ellipse></svg>`;
const AXE = `<svg viewBox="0 0 200 240" aria-hidden="true"><rect x="118" y="186" width="56" height="9" rx="4" fill="#b98250" transform="rotate(-8 146 190)"></rect><path d="M112 172 q-16 16 0 34 l16 -6 v-22 z" fill="#c9d2dc"></path></svg>`;

let state = "standing", chops = 0, need = 5, trees = 0, logs = 0, level = 1;
let cool = 9, axeT = -1, shakeT = -1, stateT = 0, chips = [];
const el = (id) => document.getElementById(id);

function setNotch() {
  // the cut in the trunk grows with each chop
  const depth = 26 * Math.min(1, chops / need), half = 3 + 9 * Math.min(1, chops / need);
  el("notch").setAttribute("points", `114,${214 - half} ${114 - depth},214 114,${214 + half}`);
}
function chop(api) {
  if (state !== "standing" || cool < 0.7) return;
  cool = 0; chops++; axeT = 0; shakeT = 0;
  api.hint("");
  api.later(0.16, () => {
    api.pop(); api.note(150 + 12 * chops, { type: "square", peak: 0.07, len: 0.18 });
    setNotch();
    const r = el("scene").getBoundingClientRect(), cx = r.left + r.width * 0.57, cy = r.top + r.height * 0.89;
    for (let i = 0; i < 7; i++) {
      const d = document.createElement("div"); d.className = "chip"; api.stage.appendChild(d);
      chips.push({ el: d, x: cx, y: cy, vx: 60 + Math.random() * 200, vy: -160 - Math.random() * 160, r: Math.random() * 360, t: 0 });
    }
    if (chops >= need) fell(api);
  });
}
function fell(api) {
  state = "falling"; stateT = 0; trees++; logs += 3;
  api.later(0.5, () => api.tune("yes"));
  api.later(1.5, () => {
    el("logs").textContent = logs;
    const pile = el("pile");
    for (let i = 0; i < 3 && pile.children.length < 12; i++) pile.insertAdjacentHTML("beforeend", LOG);
    if (trees % 5 === 0) { level++; el("level").textContent = "Level " + level; api.tune("win"); api.hint("Level " + level + "!"); api.later(3, () => api.hint("")); }
  });
}

createGame({
  name: "Woodcutter",
  intro: "Every movement swings the axe. A few chops bring the tree down with a crash, the logs pile up, and a new tree grows. There is no hurry and no way to lose.",
  background: "#8fd0ee",
  settings: [{ id: "need", label: "Chops to fell a tree", type: "select", value: "5", options: [["3", "3"], ["5", "5"], ["8", "8"]] }],
  onStart(api) {
    api.stage.innerHTML = `<div id="grass"></div><div id="pile"></div>
      <div id="scene"><div id="stump">${STUMP}</div><div id="tree">${TREE}</div><div id="axe">${AXE}</div></div>
      <div id="hud">${LOG}<span id="logs">0</span></div><div id="level">Level 1</div>`;
    state = "standing"; chops = 0; trees = 0; logs = 0; level = 1; cool = 9; axeT = -1; shakeT = -1; chips = [];
    need = +api.setting("need");
    api.hint("Move to chop");
  },
  onFrame(api, dt) {
    cool += dt;
    if (api.active) chop(api);
    // axe: swings in, then back out
    let axe = -34;
    if (axeT >= 0) { axeT += dt; const k = Math.min(1, axeT / 0.42); axe = -34 + 46 * Math.sin(Math.PI * k); if (k >= 1) axeT = -1; }
    el("axe").style.transform = `rotate(${axe.toFixed(1)}deg)`;
    el("axe").style.opacity = state === "standing" ? 1 : 0.25;
    // tree: shakes when hit, tips over when felled, then a new one grows
    const tree = el("tree");
    if (state === "standing") {
      let sh = 0;
      if (shakeT >= 0) { shakeT += dt; sh = Math.sin(shakeT * 34) * 2.2 * Math.max(0, 1 - shakeT / 0.5); if (shakeT > 0.5) shakeT = -1; }
      tree.style.transform = `rotate(${sh.toFixed(2)}deg)`; tree.style.opacity = 1;
    } else if (state === "falling") {
      stateT += dt; const k = Math.min(1, stateT / 1.4), ease = k * k;
      tree.style.transform = `rotate(${(86 * ease).toFixed(1)}deg)`; tree.style.opacity = (1 - Math.max(0, (k - 0.8) / 0.2)).toFixed(3);
      if (stateT > 2.2) { state = "growing"; stateT = 0; chops = 0; setNotch(); }
    } else if (state === "growing") {
      stateT += dt; const k = Math.min(1, stateT / 1.4), ease = 1 - Math.pow(1 - k, 3);
      tree.style.transform = `scale(${ease.toFixed(3)})`; tree.style.opacity = 1;
      if (k >= 1) { state = "standing"; api.note(392, { peak: 0.08, len: 0.5 }); }
    }
    // wood chips fly out and fall
    for (let i = chips.length - 1; i >= 0; i--) {
      const c = chips[i]; c.t += dt; c.vy += 620 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += 400 * dt;
      c.el.style.transform = `translate(${c.x}px, ${c.y}px) rotate(${c.r.toFixed(0)}deg)`; c.el.style.opacity = Math.max(0, 1 - c.t / 0.9).toFixed(3);
      if (c.t > 0.9) { c.el.remove(); chips.splice(i, 1); }
    }
  },
  onAction(api) { chop(api); },
  onPointer(api) { chop(api); },
  summary: () => [{ n: trees, label: "trees felled" }, { n: logs, label: "logs collected" }, { n: level, label: "level reached" }]
});
window.__state = () => ({ state, chops, trees, logs, level });
</script>
</body>
</html>
